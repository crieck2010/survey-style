[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "survey-style"
version = "0.1.0"
description = "Reusable visual styles/templates for the earthwatch-suite render stack"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Charles Rieck" }]

[project.urls]
Homepage = "https://github.com/crieck2010/survey-style"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
